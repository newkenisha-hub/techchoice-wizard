<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechChoice Wizard - Find Your Perfect Tech Stack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🧙‍♂️ TechChoice Wizard</h1>
            <p>Find the perfect tech stack for your project with guided recommendations</p>
        </header>

        <main>
            <!-- Category Selection -->
            <div id="category-selection" class="step active">
                <h2>What are you building?</h2>
                <div class="category-grid">
                    <button class="category-card" data-category="frontend">
                        <div class="icon">🎨</div>
                        <h3>Frontend Framework</h3>
                        <p>React, Vue, Angular, Svelte</p>
                    </button>
                    <button class="category-card" data-category="backend">
                        <div class="icon">⚙️</div>
                        <h3>Backend Framework</h3>
                        <p>Express, Django, Rails, FastAPI</p>
                    </button>
                    <button class="category-card" data-category="database">
                        <div class="icon">🗄️</div>
                        <h3>Database</h3>
                        <p>PostgreSQL, MongoDB, MySQL</p>
                    </button>
                    <button class="category-card" data-category="cloud">
                        <div class="icon">☁️</div>
                        <h3>Cloud Provider</h3>
                        <p>AWS, Azure, GCP, Vercel</p>
                    </button>
                </div>
            </div>

            <!-- Questionnaire -->
            <div id="questionnaire" class="step">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="question-container">
                    <h2 id="question-title"></h2>
                    <p id="question-description"></p>
                    <div id="question-options" class="options-grid"></div>
                </div>
                <div class="navigation">
                    <button id="prev-btn" class="btn secondary">Previous</button>
                    <button id="next-btn" class="btn primary" disabled>Next</button>
                </div>
            </div>

            <!-- Results -->
            <div id="results" class="step">
                <h2>Your Recommendations</h2>
                <div id="recommendations-container"></div>
                <button id="restart-btn" class="btn secondary">Start Over</button>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
